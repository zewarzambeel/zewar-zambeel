$('#sl').innerHTML=`<p><small>${a.length} product(s)</small></p>`+(a.map(x=>`<div class="row"><img src="${e(x.images[0]||'')}" alt=""><div><b>${e(x.name)}</b>${sbd(x)}<br>Stock: <input type="number" min="0" step="1" style="width:84px" value="${e(SC[x.id]??x.stock_qty)}" oninput="SC['${x.id}']=this.value"><br>Cost Rs.: <input type="number" min="0" step="any" style="width:96px" value="${e(SK[x.id]??x.cost??'')}" oninput="SK['${x.id}']=this.value">${x.cost!=null?' <small>Munafa/piece: Rs. '+Math.round((x.price-x.cost)*100)/100+'</small>':''}<br><button onclick="sad('${x.id}','purchase')">+ Aaya</button> <button onclick="sad('${x.id}','damaged')">- Kharab</button> <button onclick="shs('${x.id}')">History</button><div id="h_${x.id}"></div></div></div>`).join('')||'<p>No products.</p>')};
V.stock=async()=>{const[P,C]=await Promise.all([api('products?select=id,name,images,price,stock_qty,low_stock_at,is_active&order=name'),api('product_costs?select=product_id,cost_price')]),cm=Object.fromEntries(C.map(c=>[c.product_id,+c.cost_price]));SP=P.filter(x=>!isD(x)).map(x=>({...x,cost:cm[x.id]??null}));SC={};SK={};
$('#v').innerHTML=`<p><small>Stock aur cost likh kar "Save" dabayein. Maal aaye to "+ Aaya" dabayein (kitne piece aur per piece qeemat poochhe ga, average cost khud nikalta hai). Har tabdeeli ki history save hoti hai.</small></p><input type="search" placeholder="Search product" value="${e(STF.q)}" oninput="STF.q=this.value;sl()"><select onchange="STF.f=this.value;sl()"><option value="">All products</option><option value="low" ${STF.f=='low'?'selected':''}>Low / out of stock</option><option value="out" ${STF.f=='out'?'selected':''}>Out of stock only</option></select><button class="btn" onclick="ssv()">Save stock and cost</button><div id="sl"></div>`;sl()};
const ssv=W(async()=>{let n=0,m=0;for(const x of SP){const v=SC[x.id];if(v!==undefined&&v!==''){const t=Number(v);if(!Number.isInteger(t)||t<0)throw new Error('Galat stock number: '+x.name);if(t!==x.stock_qty){await rpc(x.id,'adjustment',t-x.stock_qty,'Ginti');n++}}
const k=SK[x.id];if(k!==undefined&&k!==''){const c=Number(k);if(!(c>=0))throw new Error('Galat cost: '+x.name);if(c!==x.cost){await api('product_costs','POST',{product_id:x.id,cost_price:c,updated_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});m++}}}
alert(n+' product(s) ka stock aur '+m+' ki cost update ho gayi');V.stock()}),
sad=W(async(id,r)=>{const v=prompt(r=='purchase'?'Kitne piece aaye?':'Kitne piece kharab hue?');if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<=0)throw new Error('Sahi number likhein (1 ya zyada)');let c=null;if(r=='purchase'){const cur=SP.find(x=>x.id==id)?.cost,z=prompt('Per piece khareed ki qeemat (Rs.)? Khali chhor sakte hain.',cur??'');if(z===null)return;if(z.trim()!==''){c=Number(z);if(!(c>=0))throw new Error('Qeemat sahi likhein')}}await rpc(id,r,r=='damaged'?-n:n,null,c);V.stock()}),
shs=W(async id=>{const d=$('#h_'+id);if(d.innerHTML){d.innerHTML='';return}const m=await api('stock_movements?select=*&product_id=eq.'+id+'&order=created_at.desc&limit=15'),L={sale:'Sale',cancel:'Cancel',return:'Return',purchase:'Aaya',adjustment:'Ginti',damaged:'Kharab',opening:'Shuru'};
d.innerHTML='<small>'+(m.map(x=>`${new Date(x.created_at).toLocaleDateString()} · ${L[x.reason]||x.reason} · ${x.qty_change>0?'+':''}${x.qty_change} → ${x.qty_after}${x.unit_cost!=null?' · Rs. '+x.unit_cost+'/piece':''}${x.order_no?' · order #'+x.order_no:''}`).join('<br>')||'Koi history nahi')+'</small>'});
// EXPENSES AND REPORT
const XC={courier:'Courier',packaging:'Packaging',marketing:'Marketing / Ads',software:'Software',rent_utilities:'Rent / Bills',salary:'Salary',other:'Other'},
pkd=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'}),fm=v=>'Rs. '+(Math.round(+v*100)/100).toLocaleString('en-US');
V.expenses=async()=>{const L=await api('expenses?select=*&order=spent_on.desc,created_at.desc&limit=100');
$('#v').innerHTML=`<div class="card"><h3>Naya kharcha</h3><input id="xd" type="date" value="${pkd()}"><select id="xk">${Object.entries(XC).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input id="xa" type="number" min="1" step="any" placeholder="Amount (Rs.)"><input id="xn" placeholder="Note (optional) e.g. PostEx 5 parcels"><button class="btn" onclick="xadd()">Add kharcha</button></div><p><small>Aakhri ${L.length} kharche · Total: ${fm(L.reduce((a,x)=>a+ +x.amount,0))}</small></p>`+(L.map(x=>`<div class="row"><div><b>${fm(x.amount)}</b> · ${XC[x.category]||e(x.category)}<br><small>${e(x.spent_on)}${x.note?' · '+e(x.note):''}</small></div><button onclick="dl('expenses','${x.id}')">Del</button></div>`).join('')||'<p>Abhi koi kharcha nahi.</p>')};
const xadd=W(async()=>{const a=Number($('#xa').value);if(!(a>0))throw new Error('Amount sahi likhein');if(!$('#xd').value)throw new Error('Date chunein');await api('expenses','POST',{spent_on:$('#xd').value,category:$('#xk').value,amount:a,note:$('#xn').value.trim()||null});V.expenses()});
let RM=pkd().slice(0,7);
V.report=async()=>{const[y,m]=RM.split('-').map(Number),f=RM+'-01',t=m==12?(y+1)+'-01-01':y+'-'+String(m+1).padStart(2,'0')+'-01',r=await api('rpc/profit_report','POST',{p_from:f,p_to:t}),gp=+r.sales+ +r.delivery_income-+r.cost_of_goods,np=gp-+r.expenses,col=v=>v<0?'#d11':'#1a7f37',row=(a,b,bold)=>`<div class="row"><div>${bold?'<b>'+a+'</b>':a}</div><div style="text-align:right;flex:none">${bold?'<b>'+b+'</b>':b}</div></div>`;
$('#v').innerHTML=`<input type="month" value="${e(RM)}" onchange="RM=this.value||RM;V.report()"><p><small>${r.delivered_orders} delivered order(s). Bikri tab ginti hai jab order "delivered" ho.</small></p>`+row('Bikri (delivered orders)',fm(r.sales))+row('+ Delivery charges mile',fm(r.delivery_income))+row('- Maal ki lagat',fm(r.cost_of_goods))+row('Gross profit',`<span style="color:${col(gp)}">${fm(gp)}</span>`,1)+row('- Kharche',fm(r.expenses))+Object.entries(r.expenses_by_category).map(([k,v])=>`<div class="row"><div><small>&nbsp;&nbsp;${XC[k]||e(k)}</small></div><div style="text-align:right;flex:none"><small>${fm(v)}</small></div></div>`).join('')+row('Net profit (asal munafa)',`<span style="color:${col(np)}">${fm(np)}</span>`,1)+(r.orders_missing_cost>0?`<p class="err">${r.orders_missing_cost} delivered order(s) mein kisi item ki cost maloom nahi thi, is liye munafa asal se zyada dikh raha hai. Stock tab mein cost likhein.</p>`:'')+`<p><small>Abhi rasta mein: ${r.pending_orders} order(s), ${fm(r.pending_value)} (delivered hone par ginay jayenge). Cancel: ${r.cancelled_orders}.</small></p>`};
// BACKUP (CSV downloads, open in Excel)
const BKT={orders:['orders','created_at.desc','Orders (items, address, status)'],products:['products','created_at.asc','Products (stock, cost, SEO)'],expenses:['expenses','spent_on.desc','Kharche'],stock_history:['stock_movements','created_at.asc','Stock history']},
bkcsv=R=>{if(!R.length)return'';const H=[...new Set(R.flatMap(Object.keys))],q=v=>{if(v==null)return'';if(typeof v=='object')v=JSON.stringify(v);v=String(v);if(/^([=@]|[+-][^0-9.])/.test(v))v="'"+v;return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return H.join(',')+'\r\n'+R.map(r=>H.map(k=>q(r[k])).join(',')).join('\r\n')},
bkget=async(t,o)=>{let all=[],i=0;for(;;){const r=await api(t+'?select=*&order='+o+'&limit=1000&offset='+i);all=all.concat(r);if(r.length<1000)return all;i+=1000}},
bkdl=async k=>{const[t,o]=BKT[k];let R=await bkget(t,o);if(k=='products'){const c=Object.fromEntries((await bkget('product_costs','product_id.asc')).map(x=>[x.product_id,x.cost_price]));R=R.map(x=>({...x,cost_price:c[x.id]??''}))}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+bkcsv(R)],{type:'text/csv;charset=utf-8'}));a.download='zewar-'+k+'-'+pkd()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);try{localStorage.setItem('zz_bk',pkd())}catch(x){}return R.length};
V.backup=async()=>{let last='';try{last=localStorage.getItem('zz_bk')||''}catch(x){}
$('#v').innerHTML=`<p>Data ki copy apne computer par download karein (Excel mein khulti hai). Hafte mein ek dafa karna behtar hai.</p><p><small id="bkl">${last?'Aakhri backup (is browser se): '+e(last):'Is browser se abhi tak backup nahi liya.'}</small></p><button class="btn" onclick="bkrun('all')">Sab download karein (4 files)</button>`+Object.entries(BKT).map(([k,v])=>`<button class="btn" style="background:#555" onclick="bkrun('${k}')">${v[2]}</button>`).join('')+'<p id="bkm"></p>'};
const bkrun=W(async k=>{const m=$('#bkm'),ks=k=='all'?Object.keys(BKT):[k],out=[];m.textContent='Download ho raha hai...';for(const x of ks){out.push((BKT[x][2]||x)+': '+await bkdl(x)+' rows');if(ks.length>1)await new Promise(r=>setTimeout(r,500))}m.innerHTML=out.map(e).join('<br>')+'<br><b>Ho gaya.</b> Agar browser ne multiple downloads rok diye hon to "Allow" karein.';$('#bkl').textContent='Aakhri backup (is browser se): '+pkd()});
// BANNERS (saved as JSON in the settings table under key "banners")
let BN=[];
const lk=l=>!l?'No link':l=='#/c/all'?'All jewellery':(CT.find(c=>'#/c/'+c.id==l)||{name:'a category'}).name,
bsave=()=>api('settings?on_conflict=key','POST',[{key:'banners',value:JSON.stringify(BN)}],{Prefer:'resolution=merge-duplicates,return=minimal'}),
bl=()=>{$('#v').innerHTML=`<h3>Home page banners</h3><p>Banners slide automatically at the top of the home page. If there are none, the normal welcome section is shown.</p>`+BN.map((b,i)=>`<div class="card"><img src="${e(b.d)}" style="width:100%;border-radius:8px" alt=""><p>${b.m?'Has a mobile image':'No separate mobile image'} · Opens: ${e(lk(b.l))}</p><button onclick="bmv(${i},-1)">Move up</button> <button onclick="bmv(${i},1)">Move down</button> <button onclick="bdel(${i})">Delete</button></div>`).join('')+`<div class="card"><h3>Add banner</h3><label>Banner image (wide, about 1600 x 600)<input type="file" id="fb_d" accept="image/*"></label><label>Mobile image (optional, about 1200 x 900)<input type="file" id="fb_m" accept="image/*"></label><label>When tapped, open<select id="fb_l"><option value="">Nothing</option><option value="#/c/all">All jewellery</option>${CT.map(c=>`<option value="#/c/${c.id}">${e(c.name)}</option>`).join('')}</select></label><button class="btn" id="fb_b" onclick="badd()">Add banner</button></div>`};
V.banners=async()=>{const[s,c]=await Promise.all([api('settings?select=*&key=eq.banners'),api('categories?select=id,name&order=sort_order')]);CT=c;try{BN=JSON.parse(s[0]?.value||'[]')}catch(x){BN=[]}bl()};
const badd=W(async()=>{const f=$('#fb_d').files[0],m=$('#fb_m').files[0],t=$('#fb_b');if(!f)throw new Error('Please choose the banner image');
try{t.disabled=true;t.textContent='Uploading...';const b={d:await up(f,1800),l:$('#fb_l').value};if(m)b.m=await up(m,1200);BN.push(b);await bsave();bl()}finally{t.disabled=false;t.textContent='Add banner'}}),
bmv=W(async(i,d)=>{const j=i+d;if(j<0||j>=BN.length)return;[BN[i],BN[j]]=[BN[j],BN[i]];await bsave();bl()}),
bdel=W(async i=>{if(!confirm('Delete this banner?'))return;BN.splice(i,1);await bsave();bl()});
// CATEGORIES
let CG=[],ce={};
V.categories=async()=>{CG=await api('categories?select=*&order=sort_order');$('#v').innerHTML=`<button class="btn" onclick="cf()">+ Add category</button><div id="cfm"></div>`+CG.map(x=>`<div class="row"><img src="${e(x.image_url||'')}" alt=""><div><b>${e(x.name)}</b>${x.is_active?'':' · hidden'}</div><button onclick="cf('${x.id}')">Edit</button><button onclick="dl('categories','${x.id}')">Del</button></div>`).join('')};
function cf(id){ce=id?{...CG.find(c=>c.id==id)}:{name:'',image_url:'',sort_order:(CG.length?Math.max(...CG.map(c=>c.sort_order)):0)+1,is_active:true};
$('#cfm').innerHTML=`<div class="card"><input id="cn" placeholder="Category name" value="${e(ce.name)}">${ce.image_url?`<span class="th"><img src="${e(ce.image_url)}" alt=""></span>`:''}<label>Round photo (optional)<input type="file" id="cim" accept="image/*"></label><label>Order number<input id="co" type="number" value="${ce.sort_order}"></label><label><input type="checkbox" id="ca" ${ce.is_active?'checked':''}>Visible on website</label><button class="btn" onclick="cs()">Save category</button></div>`;scrollTo(0,0)}
const cs=W(async()=>{const n=$('#cn').value.trim();if(!n)throw new Error('Category name is required');const f=$('#cim').files[0];if(f)ce.image_url=await up(f);
const b={name:n,image_url:ce.image_url||null,sort_order:+$('#co').value||0,is_active:$('#ca').checked};
if(ce.id)await api('categories?id=eq.'+ce.id,'PATCH',b);else await api('categories','POST',{...b,slug:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5)});
alert('Category saved');V.categories()});
// PLACES: province > city > area
V.places=async()=>{const l=await api('locations?select=*&order=name&limit=3000'),hasDC=!l.length||('delivery_charge' in l[0]),pv=l.filter(x=>x.type=='province'),ct=l.filter(x=>x.parent_id==sp&&x.type=='city'),ar=l.filter(x=>x.parent_id==sc&&x.type=='area'),
o=(a,v)=>`<option value="">Select</option>`+a.map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${e(x.name)}</option>`).join('');
$('#v').innerHTML=`<h3>Province</h3><select onchange="sp=this.value;sc='';V.places()">${o(pv,sp)}</select>${sp?`<button onclick="dl('locations','${sp}')">Delete this province</button>${dcbox(hasDC,pv.find(x=>x.id==sp),ct)}<h3>Cities</h3><textarea id="a_city" rows="2" placeholder="Add cities (comma separated)"></textarea><button onclick="al('city',sp)">Add cities</button><select onchange="sc=this.value;V.places()">${o(ct,sc)}</select>`:''}${sc?`<button onclick="dl('locations','${sc}')">Delete this city</button><h3>Areas</h3><textarea id="a_area" rows="3" placeholder="Add areas (comma separated)"></textarea><button onclick="al('area',sc)">Add areas</button><div>${ar.map(x=>`<span class="chip">${e(x.name)}<a onclick="dl('locations','${x.id}')">x</a></span>`).join('')}</div>`:''}`};
const dcn=x=>x.delivery_charge==null?'':x.delivery_charge,
dci=(x,ph)=>`<input class="dc" data-id="${x.id}" data-old="${dcn(x)}" type="number" min="0" step="1" value="${dcn(x)}" placeholder="${ph}">`,
dcbox=(ok,pr,cities)=>ok?`<div class="card"><h3>Delivery charges</h3><p>Leave a box empty to use the next level: city, then province, then the default charge in Settings. Write 0 for free delivery.</p><label>${e(pr.name)} (whole province, Rs.)${dci(pr,'Default')}</label>${cities.map(c=>`<label>${e(c.name)} (Rs.)${dci(c,'Same as province')}</label>`).join('')}<button class="btn" onclick="dcs()">Save delivery charges</button></div>`:'<p class="err">Delivery charges are not set up yet. Run delivery-charges.sql once in Supabase (SQL Editor), then reopen this tab.</p>',
dcs=W(async()=>{const ch=[...document.querySelectorAll('.dc')].filter(i=>i.value!==i.dataset.old);if(!ch.length){alert('Nothing was changed');return}if(ch.some(i=>i.value!==''&&!(+i.value>=0)))throw new Error('Charges must be 0 or more');await Promise.all(ch.map(i=>api('locations?id=eq.'+i.dataset.id,'PATCH',{delivery_charge:i.value===''?null:+i.value})));alert('Saved '+ch.length+' charge(s)');V.places()});
const al=W(async(t,p)=>{const n=ls($('#a_'+t).value);if(!n.length)return;await api('locations','POST',n.map(name=>({name,type:t,parent_id:p})));V.places()});
// REVIEWS: customers submit, you approve (or add your own from WhatsApp screenshots)
let RW=[],RP=[];
const pn=id=>(RP.find(p=>p.id==id)||{}).name||'General',stx=n=>'★'.repeat(n)+'☆'.repeat(5-n),
rwr=x=>`<div class="card">${x.image_url?`<img src="${e(x.image_url)}" style="max-width:160px;border-radius:8px;display:block;margin-bottom:6px" alt="">`:''}<p><b>${e(x.name)}</b> &middot; ${stx(x.rating)} &middot; ${e(pn(x.product_id))}</p><p>${e(x.comment)}</p><small>${new Date(x.created_at).toLocaleString()}</small><br>${x.is_approved?`<button onclick="rwa('${x.id}',false)">Hide from website</button>`:`<button onclick="rwa('${x.id}',true)">Approve</button>`} <button onclick="dl('reviews','${x.id}')">Delete</button></div>`,
rwl=()=>{const w=RW.filter(x=>!x.is_approved),a=RW.filter(x=>x.is_approved);
$('#v').innerHTML=`<h3>Waiting for approval (${w.length})</h3>${w.map(rwr).join('')||'<p>No new reviews.</p>'}<div class="card"><h3>Add a review yourself</h3><p>For reviews customers sent you on WhatsApp. It shows on the website straight away.</p><input id="mr_n" placeholder="Customer name" maxlength="60"><select id="mr_r">${[5,4,3,2,1].map(n=>`<option value="${n}">${stx(n)}</option>`).join('')}</select><select id="mr_p"><option value="">General</option>${RP.map(p=>`<option value="${e(p.id)}">${e(p.name)}</option>`).join('')}</select><textarea id="mr_c" rows="3" maxlength="600" placeholder="Review text"></textarea><label>Photo (optional)<input type="file" id="mr_f" accept="image/*"></label><button class="btn" id="mr_b" onclick="rwadd()">Add review</button></div><h3>On the website (${a.length})</h3>${a.map(rwr).join('')||'<p>None yet.</p>'}`};
V.reviews=async()=>{try{[RW,RP]=await Promise.all([api('reviews?select=*&order=created_at.desc&limit=300'),api('products?select=id,name&order=name')])}catch(x){if(/JWT/.test(x.message))return;$('#v').innerHTML='<p class="err">Reviews are not set up yet. Open Supabase > SQL Editor, paste the contents of reviews.sql and click Run (one time). Then reopen this tab.</p>';return}rwl()};
const rwa=W(async(id,v)=>{await api('reviews?id=eq.'+id,'PATCH',{is_approved:v});V.reviews()}),
rwadd=W(async()=>{const n=$('#mr_n').value.trim(),c=$('#mr_c').value.trim(),t=$('#mr_b');if(!n||!c)throw new Error('Please enter the name and the review text');
try{t.disabled=true;t.textContent='Saving...';const f=$('#mr_f').files[0];await api('reviews','POST',{name:n,rating:+$('#mr_r').value,comment:c,product_id:$('#mr_p').value||null,image_url:f?await up(f):null,is_approved:true})}finally{t.disabled=false;t.textContent='Add review'}V.reviews()});
